<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Emergência | Safe Babá</title><link rel="stylesheet" href="/css/styles.css"><link rel="stylesheet" href="/css/tema.css"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Public+Sans:wght@400;600;800&display=swap"></head><body><header class="topbar"><div class="container nav"><a class="brand" href="/index.html"><span class="brand-mark">♥</span>Safe Babá</a><a class="btn btn-outline" href="/painel.html">Painel</a></div></header><main class="section"><div class="container"><div class="card" style="max-width:760px;margin:auto"><span class="eyebrow">Atendimento rápido</span><h1>Preciso de uma babá agora</h1><p class="muted">Sugerimos as profissionais da sua cidade com maior Índice de Confiança. Escolha uma e o acompanhamento começa na hora.</p><div id="msg" class="notice hide" role="status"></div><form id="f" class="hide"><label>Endereço do atendimento<input class="input" name="endereco" required></label><label>Crianças<select class="input" name="qtd"><option>1</option><option>2</option><option>3</option></select></label><label>Duração<select class="input" name="h"><option value="2">2 horas</option><option value="4">4 horas</option><option value="8">8 horas</option></select></label></form><div id="mapa" class="hide" style="height:260px;border-radius:16px;margin-top:18px"></div><p id="mapaNota" class="muted hide">Posições simuladas, apenas para demonstração.</p><div id="lista" class="cards" style="margin-top:18px"></div></div></div></div></main><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"><script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script><script src="/js/app.js"></script><script>
const $=s=>document.querySelector(s),u=getUser();let paiId=null;
function aviso(t,e){const m=$('#msg');m.className='notice'+(e?' error':'');m.textContent=t}
const hh=d=>String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
async function chamar(babaId){const f=$('#f');if(!f.endereco.value.trim())return aviso('Informe o endereço do atendimento.',1);const n=new Date(),e=new Date(n.getTime()+Number(f.h.value)*36e5),ini=hh(n),fim=e.getDate()!==n.getDate()?'23:59':hh(e),dia=n.getFullYear()+'-'+String(n.getMonth()+1).padStart(2,'0')+'-'+String(n.getDate()).padStart(2,'0');try{const r=await api('/agendamentos',{method:'POST',body:JSON.stringify({paiId,babaId,dataServico:dia,horaInicio:ini,horaFim:fim,endereco:f.endereco.value.trim(),quantidadeCriancas:Number(f.qtd.value),observacoes:'URGENTE'})});location.href='/atendimento.html?id='+r.id}catch(x){aviso(x.message,1)}}
async function init(){if(!u||u.tipo!=='PAI'){aviso('Entre como responsável para chamar uma babá agora.',1);$('#lista').innerHTML='<a class="btn btn-primary" href="/login.html">Entrar</a>';return}try{const p=await api('/pais/usuario/'+u.id);paiId=p.id;$('#f').classList.remove('hide');$('#f').endereco.value=p.endereco||'';const [b,c]=await Promise.all([api('/babas?cidade='+encodeURIComponent(p.cidade||'')),api('/confianca')]);const l=b.filter(x=>x.verificada).sort((x,y)=>(c[y.id]?.score||0)-(c[x.id]?.score||0)).slice(0,3);mapa(l,p.cidade);$('#lista').innerHTML=l.length?l.map(x=>`<article class="card"><div class="baba-head">${c[x.id]?ring(c[x.id].score):''}<div style="flex:1"><strong>${esc(x.nome)}</strong><div class="muted">${x.experienciaAnos||0} anos • ★ ${Number(x.notaMedia||0).toFixed(1)} • ${money(x.valorHora)}/h</div></div><button class="btn btn-primary" onclick="chamar(${Number(x.id)})">Chamar agora</button></div></article>`).join(''):'<div class="empty">Nenhuma profissional verificada na sua cidade agora.</div>'}catch(e){aviso(e.message,1)}}
function mapa(l,cidade){if(!window.L||!l.length)return;const C={'São Paulo':[-23.5505,-46.6333],'Campinas':[-22.9099,-47.0626],'Santos':[-23.9608,-46.3336]},c=C[cidade]||C['São Paulo'];$('#mapa').classList.remove('hide');$('#mapaNota').classList.remove('hide');const m=L.map('mapa').setView(c,12);L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:18,attribution:'© OpenStreetMap'}).addTo(m);L.marker(c).addTo(m).bindPopup('Você (simulado)');l.forEach(x=>L.marker([c[0]+((x.id*37%100)-50)/1500,c[1]+((x.id*53%100)-50)/1500]).addTo(m).bindPopup(esc(x.nome)))}
init();</script><script src="/js/ui.js"></script></body></html>
