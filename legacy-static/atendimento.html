<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Atendimento | Safe Babá</title><link rel="stylesheet" href="/css/styles.css"><link rel="stylesheet" href="/css/tema.css"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Public+Sans:wght@400;600;800&display=swap">
<style>.tl{list-style:none;margin:0;padding:0 0 0 18px;border-left:3px solid var(--line)}.tl li{position:relative;margin:0 0 18px;padding-left:14px;animation:in .3s ease-out}.tl li::before{content:"";position:absolute;left:-26px;top:6px;width:13px;height:13px;border-radius:50%;background:var(--lamp)}.tl .SOS::before{background:var(--rose)}.tl small{color:var(--mute)}.acoes{display:flex;flex-wrap:wrap;gap:10px;margin:14px 0}.codigo{font:800 2.4rem var(--fd);letter-spacing:.2em}.sos{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0));background:var(--rose);color:#fff;border:0;border-radius:999px;min-height:56px;padding:0 26px;font:800 1rem var(--fb);box-shadow:0 8px 24px rgba(0,0,0,.25);cursor:pointer}@keyframes in{from{opacity:0;transform:translateY(6px)}}@media(prefers-reduced-motion:reduce){.tl li{animation:none}}</style></head><body>
<header class="topbar"><div class="container nav"><a class="brand" href="/index.html"><span class="brand-mark">♥</span>Safe Babá</a><div class="nav-actions"><a class="btn btn-outline" href="/painel.html">Painel</a></div></div></header>
<main class="section"><div class="container"><span class="eyebrow">Atendimento</span><h1>Acompanhamento ao vivo</h1><p class="muted">Código de chegada, diário e alerta de emergência em um só lugar.</p><div id="msg" class="notice hide" role="status"></div><div id="acoes" class="card"></div><div id="cam"></div><div id="pg" class="acoes"></div><div id="cc"></div><div id="av"></div><div class="acoes" style="margin-top:14px"><input class="input" id="msgtxt" maxlength="300" placeholder="Escreva uma mensagem" aria-label="Mensagem"><button class="btn btn-outline" onclick="enviar()">Enviar</button></div><h2 style="margin-top:20px">Linha do tempo e conversa</h2><ul id="tl" class="tl"></ul></div></main>
<button class="sos" id="sos" aria-label="Acionar alerta SOS">🚨 SOS</button>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script><script src="/js/app.js"></script><script>
const id=new URLSearchParams(location.search).get('id'),u=getUser(),$=s=>document.querySelector(s);
const T={CODIGO:'🔑 Código de chegada gerado',CHECKIN:'✅ Chegada confirmada',DIARIO:'📝 Diário',SOS:'🚨 SOS acionado',MSG:'💬 Mensagem',PAGTO_RETIDO:'💳 Pagamento retido (simulado)',PAGTO_LIBERADO:'💸 Pagamento liberado (simulado)',CHECKOUT:'🏁 Atendimento encerrado'};
function aviso(t,erro){const m=$('#msg');m.className='notice'+(erro?' error':'');m.textContent=t}
async function act(p,b){try{await api('/atendimentos/'+id+'/'+p,{method:'POST',body:JSON.stringify(b||{})});$('#msg').className='hide';await carregar()}catch(e){aviso(e.message,1)}}
async function carregar(){try{const l=await api('/atendimentos/'+id+'/linha');$('#tl').innerHTML=l.length?l.map(e=>`<li class="${esc(e.tipo)}"><b>${T[e.tipo]||esc(e.tipo)}</b>${['DIARIO','SOS','MSG'].includes(e.tipo)?'<br>'+(e.tipo==='MSG'?(e.de==='PAI'?'Responsável: ':'Babá: '):'')+esc(e.texto):''}<br><small>${new Date(e.criadoEm).toLocaleString('pt-BR')}</small></li>`).join(''):'<div class="empty">Nada registrado ainda.</div>';const t=x=>l.some(e=>e.tipo===x),cod=[...l].reverse().find(e=>e.tipo==='CODIGO'),em=t('CHECKIN')&&!t('CHECKOUT');let h='';
if(u.tipo==='PAI'){h=t('CHECKIN')?'<p>Babá no local. Você acompanha tudo abaixo.</p>':`<p>Quando a babá chegar, informe este código:</p>${cod?`<div class="codigo">${esc(cod.texto)}</div><div id="qr" style="margin:12px 0"></div><p class="muted">Ou mostre o QR Code para a babá escanear.</p>`:''}<div class="acoes"><button class="btn btn-primary" onclick="act('codigo')">${cod?'Gerar novo código':'Gerar código de chegada'}</button></div>`}
else if(!t('CHECKIN')){h='<p>Peça o código ao responsável ao chegar.</p><div class="acoes"><input class="input" id="cod" inputmode="numeric" maxlength="6" placeholder="Código de 6 dígitos" aria-label="Código"><button class="btn btn-primary" onclick="act(\'checkin\',{codigo:$(\'#cod\').value})">Confirmar chegada</button><button class="btn btn-outline" onclick="escanear()">Escanear QR</button></div>'}
else if(em){h='<div class="acoes">'+['Comeu','Dormiu','Trocou fralda','Tomou remédio','Brincando'].map(x=>`<button class="btn btn-outline" onclick="act('diario',{texto:'${x}'})">${x}</button>`).join('')+'</div><div class="acoes"><input class="input" id="nota" maxlength="300" placeholder="Observação" aria-label="Observação"><button class="btn btn-outline" onclick="act(\'diario\',{texto:$(\'#nota\').value})">Enviar</button><button class="btn btn-primary" onclick="act(\'checkout\')">Encerrar atendimento</button></div>'}else h='<p>Atendimento encerrado.</p>';
extras(t,em);if(h!==window._h){window._h=h;$('#acoes').innerHTML=h;if(cod&&$('#qr')){try{new QRCode($('#qr'),{text:location.origin+'/atendimento.html?id='+Number(id)+'&codigo='+encodeURIComponent(cod.texto),width:180,height:180})}catch{}}}}catch(e){aviso(e.message,1)}}
async function escanear(){if(!('BarcodeDetector' in window))return aviso('Este navegador não lê QR Code. Use a câmera do celular ou digite o código.',1);try{const v=document.createElement('video');v.setAttribute('playsinline','');v.style.cssText='width:100%;max-width:320px;border-radius:12px;margin-top:12px';const s=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});v.srcObject=s;$('#cam').innerHTML='';$('#cam').append(v);await v.play();const d=new BarcodeDetector({formats:['qr_code']}),stop=()=>{s.getTracks().forEach(t=>t.stop());v.srcObject=null;$('#cam').innerHTML=''};const loop=async()=>{if(!v.srcObject)return;const r=await d.detect(v).catch(()=>[]);if(r.length){stop();let c=null;try{c=new URL(r[0].rawValue).searchParams.get('codigo')}catch{}return c?act('checkin',{codigo:c}):aviso('QR Code inválido.',1)}requestAnimationFrame(loop)};loop()}catch{aviso('Não foi possível usar a câmera. Digite o código.',1)}}
async function extras(t,em){$('#pg').innerHTML=u.tipo==='PAI'&&!t('PAGTO_RETIDO')&&!t('CHECKOUT')?`<button class="btn btn-outline" onclick="act('pagar')">Pagar via PIX (simulado)</button>`:'';
if(u.tipo==='PAI'||em){if(!window._cc){try{const l=await api('/atendimentos/'+Number(id)+'/cuidados');window._cc=1;$('#cc').innerHTML=l.length?'<div class="card" style="margin-top:14px"><h3>Cartão de cuidados</h3>'+l.map(c=>`<p><b>${esc(c.nome)}</b> (${Number(c.idade)} anos)<br>Alergias: ${esc(c.alergias||'—')}<br>Remédios: ${esc(c.remedios||'—')}<br>Rotina: ${esc(c.rotina||'—')}<br>Pediatra: ${esc(c.pediatra||'—')} • Emergência: ${esc(c.contato||'—')}</p>`).join('')+'</div>':''}catch{}}}else{window._cc=0;$('#cc').innerHTML=''}
if(u.tipo==='PAI'&&t('CHECKOUT')&&!window._avf){window._avf=1;try{const a=(await api('/agendamentos/minha-agenda')).find(x=>x.id==id);if(a)$('#av').innerHTML=`<div class="card" style="margin-top:14px"><h3>Como foi o atendimento?</h3><div class="acoes"><select class="input" id="an" aria-label="Nota"><option value="5">5 ★</option><option value="4">4 ★</option><option value="3">3 ★</option><option value="2">2 ★</option><option value="1">1 ★</option></select><label><input type="checkbox" id="ap" checked> Pontual</label><label><input type="checkbox" id="ac" checked> Boa comunicação</label><label><input type="checkbox" id="ae" checked> Experiente</label></div><div class="acoes"><input class="input" id="acm" maxlength="400" placeholder="Comentário (opcional)" aria-label="Comentário"><button class="btn btn-primary" onclick="avaliar(${Number(a.babaId)},${Number(a.paiId)})">Enviar avaliação</button></div></div>`}catch{}}}
async function avaliar(b,p){try{await api('/avaliacoes',{method:'POST',body:JSON.stringify({babaId:b,paiId:p,agendamentoId:Number(id),nota:Number($('#an').value),comentario:$('#acm').value,pontualidade:$('#ap').checked,comunicacao:$('#ac').checked,experiencia:$('#ae').checked})});$('#av').innerHTML='<div class="notice">Obrigado pela avaliação!</div>'}catch(e){aviso(e.message,1)}}
async function enviar(){const i=$('#msgtxt');if(!i.value.trim())return;await act('mensagem',{texto:i.value});i.value=''}
$('#sos').onclick=()=>{if(!confirm('Acionar o alerta SOS agora?'))return;const go=l=>act('sos',l?{local:l}:{});navigator.geolocation?navigator.geolocation.getCurrentPosition(p=>go(p.coords.latitude.toFixed(5)+', '+p.coords.longitude.toFixed(5)),()=>go(),{timeout:4000}):go()};
const cq=new URLSearchParams(location.search).get('codigo');if(!u||!id){location.href='/login.html'}else{if(cq&&u.tipo==='BABA'){history.replaceState(null,'','?id='+Number(id));act('checkin',{codigo:cq})}else carregar();setInterval(carregar,5000)}
</script></body></html>
