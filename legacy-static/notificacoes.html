<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Notificações | Safe Babá</title><link rel="stylesheet" href="/css/styles.css"><link rel="stylesheet" href="/css/tema.css"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Public+Sans:wght@400;600;800&display=swap"></head><body><header class="topbar"><div class="container nav"><a class="brand" href="/index.html"><span class="brand-mark">♥</span>Safe Babá</a><div class="nav-actions"><a class="btn btn-outline" href="/painel.html">Painel</a></div></div></header><main class="section"><div class="container"><span class="eyebrow">Central</span><h1>Notificações</h1><div id="msg" class="notice hide"></div><div id="lista" class="cards" style="margin-top:18px"></div></div></main><script src="/js/app.js"></script><script>
const $=s=>document.querySelector(s),T={CHECKIN:'✅ A babá chegou',CHECKOUT:'🏁 Atendimento encerrado',DIARIO:'📝 Novo registro no diário',SOS:'🚨 Alerta SOS',MSG:'💬 Nova mensagem',PAGTO_RETIDO:'💳 Pagamento retido (simulado)',PAGTO_LIBERADO:'💸 Pagamento liberado (simulado)'};
(async()=>{if(!getUser()){location.href='/login.html';return}try{const l=await api('/notificacoes'),v=Number(localStorage.sbVisto||0);$('#lista').innerHTML=l.length?l.map(n=>`<a class="card" href="/atendimento.html?id=${Number(n.agendamentoId)}"><b>${new Date(n.criadoEm).getTime()>v?'● ':''}${T[n.tipo]||esc(n.tipo)}</b><div class="muted">${esc(n.texto)} • ${new Date(n.criadoEm).toLocaleString('pt-BR')}</div></a>`).join(''):'<div class="empty">Sem notificações por enquanto.</div>';localStorage.sbVisto=Date.now()}catch(e){$('#msg').className='notice error';$('#msg').textContent=e.message}})();
</script></body></html>
