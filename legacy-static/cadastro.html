<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Criar conta | Safe Babá</title><link rel="stylesheet" href="/css/styles.css"><link rel="stylesheet" href="/css/tema.css"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Public+Sans:wght@400;600;800&display=swap"></head><body><header class="topbar"><div class="container nav"><a class="brand" href="/index.html"><span class="brand-mark">♥</span>Safe Babá</a><a class="btn btn-outline" href="/login.html">Já tenho conta</a></div></header><main class="section"><div class="container"><div class="card form-card"><div class="section-head"><div><span class="eyebrow">Comece em poucos minutos</span><h1>Crie sua conta</h1><p class="muted">Escolha seu perfil e preencha apenas o necessário.</p></div></div><div class="tabs"><button class="tab active" type="button" data-tipo="PAI">Sou responsável</button><button class="tab" type="button" data-tipo="BABA">Sou babá</button></div><form id="signupForm"><input type="hidden" name="tipo" id="tipo" value="PAI"><div class="form-grid"><label>Nome<input class="input" name="nome" required></label><label>E-mail<input class="input" type="email" name="email" required></label><label>Telefone<input class="input" name="telefone" required></label><label>Data de nascimento<input class="input" type="date" name="dataNascimento"></label><label>Cidade<input class="input" name="cidade" required></label><label>Estado<input class="input" name="estado" maxlength="2" placeholder="SP" required></label><label>Senha<input class="input" type="password" name="senha" required minlength="6"></label><label>Confirmar senha<input class="input" type="password" name="confirmarSenha" required minlength="6"></label></div><div id="babaExtras" class="form-grid hide" style="margin-top:14px"><label>Experiência (anos)<input class="input" type="number" min="0" name="experienciaAnos"></label><label>Valor por hora<input class="input" type="number" min="0" step="0.01" name="valorHora"></label><label>Disponibilidade<input class="input" name="disponibilidade" placeholder="Ex.: Seg a Sex, 08h às 18h"></label><label class="full">Descrição profissional<textarea class="textarea" rows="4" name="descricao" placeholder="Conte um pouco sobre sua experiência."></textarea></label></div><div id="msg" class="notice" style="margin-top:16px">Seus dados ficam organizados no banco do sistema.</div><label class="chk" style="display:flex;gap:8px;align-items:center;min-height:44px"><input type="checkbox" required> Li e aceito a <a href="/privacidade.html" target="_blank" rel="noopener"><u>política de privacidade</u></a></label><button class="btn btn-primary" style="width:100%">Criar minha conta</button></form></div></div></main><script src="/js/app.js"></script><script src="/js/ui.js"></script></body></html>
