<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin | Safe Babá</title><link rel="stylesheet" href="/css/styles.css"><link rel="stylesheet" href="/css/tema.css"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Public+Sans:wght@400;600;800&display=swap"></head><body><header class="topbar"><div class="container nav"><a class="brand" href="/index.html"><span class="brand-mark">♥</span>Safe Babá</a><a class="btn btn-outline" href="/painel.html">Painel</a></div></header><main class="section"><div class="container"><div class="section-head"><div><span class="eyebrow">Gestão</span><h1>Painel administrativo</h1><p class="muted">Indicadores, verificação de documentos e alertas de emergência. Demo: admin@demo.com / 123456</p></div></div><div class="stats"><div class="card stat-card"><span>Usuários</span><strong id="kU">—</strong></div><div class="card stat-card"><span>Babás verificadas</span><strong id="kB">—</strong></div><div class="card stat-card"><span>Agendamentos</span><strong id="kA">—</strong></div><div class="card stat-card"><span>Denúncias</span><strong id="kD">—</strong></div><div class="card stat-card"><span>Alertas SOS</span><strong id="kS">—</strong></div></div><div id="msg" class="notice hide" role="status"></div><h2 style="margin-top:28px">Documentos para aprovar</h2><div id="docs" class="cards"></div><h2 style="margin-top:28px">Alertas SOS</h2><div id="sos" class="cards"></div></div></div></main><script src="/js/app.js"></script><script>
const $=s=>document.querySelector(s);
async function aprovar(id){try{await api('/admin/documentos/'+id+'/aprovar',{method:'POST'});ld()}catch(e){aviso(e.message)}}
function aviso(t){const m=$('#msg');m.className='notice error';m.textContent=t}
async function ld(){try{const r=await api('/admin/resumo');$('#kU').textContent=r.usuarios;$('#kB').textContent=r.babasVerificadas;$('#kA').textContent=r.agendamentos;$('#kD').textContent=r.denuncias;$('#kS').textContent=r.sos;
const d=await api('/admin/documentos/pendentes');$('#docs').innerHTML=d.length?d.map(x=>`<article class="card"><div class="split"><div><strong>${esc(x.nome)}</strong><div class="muted">${esc(x.tipo)}</div></div><button class="btn btn-primary" onclick="aprovar(${Number(x.babaId)})">Aprovar</button></div></article>`).join(''):'<div class="empty">Nenhum documento pendente.</div>';
const s=await api('/admin/sos');$('#sos').innerHTML=s.length?s.map(x=>`<article class="card"><b>🚨 Agendamento #${Number(x.agendamentoId)}</b><div class="muted">${esc(x.texto)} • ${new Date(x.criadoEm).toLocaleString('pt-BR')}</div></article>`).join(''):'<div class="empty">Nenhum alerta registrado.</div>'}catch(e){aviso(getToken()?'Acesso restrito a administradores.':'Entre como administrador (admin@demo.com).')}}
ld();</script><script src="/js/ui.js"></script></body></html>
