<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Crianças | Safe Babá</title><link rel="stylesheet" href="/css/styles.css"><link rel="stylesheet" href="/css/tema.css"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Public+Sans:wght@400;600;800&display=swap"></head><body><header class="topbar"><div class="container nav"><a class="brand" href="/index.html"><span class="brand-mark">♥</span>Safe Babá</a><div class="nav-actions"><a class="btn btn-outline" href="/painel.html">Painel</a></div></div></header><main class="section"><div class="container" style="max-width:760px"><span class="eyebrow">Cartão de cuidados</span><h1>Suas crianças</h1><p class="muted">A babá só vê estes dados durante um atendimento em andamento.</p><div id="msg" class="notice hide" role="status"></div><form id="f" class="card" style="display:grid;gap:10px"><input class="input" name="nome" placeholder="Nome" required maxlength="80" aria-label="Nome"><input class="input" name="idade" type="number" min="0" max="17" placeholder="Idade" required aria-label="Idade"><input class="input" name="alergias" placeholder="Alergias" maxlength="200" aria-label="Alergias"><input class="input" name="remedios" placeholder="Remédios e horários" maxlength="200" aria-label="Remédios"><input class="input" name="rotina" placeholder="Rotina (sono, comida)" maxlength="200" aria-label="Rotina"><input class="input" name="pediatra" placeholder="Pediatra" maxlength="120" aria-label="Pediatra"><input class="input" name="contato" placeholder="Contato de emergência" maxlength="120" aria-label="Contato de emergência"><button class="btn btn-primary">Salvar</button></form><div id="lista" class="cards" style="margin-top:18px"></div></div></main><script src="/js/app.js"></script><script>
const $=s=>document.querySelector(s);function aviso(t){const m=$('#msg');m.className='notice error';m.textContent=t}
async function del(id){try{await api('/cuidados/'+id,{method:'DELETE'});ld()}catch(e){aviso(e.message)}}
async function ld(){try{const l=await api('/cuidados');$('#lista').innerHTML=l.length?l.map(c=>`<article class="card"><div class="split"><strong>${esc(c.nome)} • ${Number(c.idade||0)} anos</strong><button class="btn btn-outline" onclick="del(${Number(c.id)})">Remover</button></div><p class="muted">Alergias: ${esc(c.alergias||'—')} • Remédios: ${esc(c.remedios||'—')}<br>Rotina: ${esc(c.rotina||'—')}<br>Pediatra: ${esc(c.pediatra||'—')} • Emergência: ${esc(c.contato||'—')}</p></article>`).join(''):'<div class="empty">Nenhuma criança cadastrada.</div>'}catch(e){aviso(e.message)}}
$('#f').onsubmit=async e=>{e.preventDefault();try{await api('/cuidados',{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(e.target).entries()))});e.target.reset();ld()}catch(x){aviso(x.message)}};
if(!getUser())location.href='/login.html';else ld();
</script></body></html>
