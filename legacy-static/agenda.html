<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Agenda | Safe Babá</title><link rel="stylesheet" href="/css/styles.css"><link rel="stylesheet" href="/css/tema.css"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Public+Sans:wght@400;600;800&display=swap"></head><body>
<header class="topbar"><div class="container nav"><a class="brand" href="/index.html"><span class="brand-mark">♥</span>Safe Babá</a><div class="nav-actions"><a class="btn btn-outline" href="/painel.html">Painel</a></div></div></header>
<main class="section"><div class="container"><span class="eyebrow">Agenda</span><h1>Seus atendimentos</h1><p class="muted">Aceite, acompanhe e converse em cada atendimento.</p><div id="msg" class="notice hide" role="status"></div><div id="lista" class="cards" style="margin-top:18px"></div></div></main>
<script src="/js/app.js"></script><script>
const u=getUser(),$=s=>document.querySelector(s),ST={PENDENTE:'Aguardando aceite',ACEITO:'Aceito',RECUSADO:'Recusado',CONCLUIDO:'Concluído',CANCELADO:'Cancelado'};
function aviso(t){const m=$('#msg');m.className='notice error';m.textContent=t}
async function mudar(id,v){try{await api('/agendamentos/'+Number(id)+'/status?valor='+v,{method:'PATCH'});ld()}catch(e){aviso(e.message)}}
async function ld(){if(!u){location.href='/login.html';return}try{const l=await api('/agendamentos/minha-agenda');l.sort((a,b)=>b.id-a.id);$('#lista').innerHTML=l.length?l.map(a=>{const ativo=a.status==='PENDENTE'||a.status==='ACEITO'||a.status==='CONCLUIDO';return `<article class="card"><div class="split"><strong>${esc(a.dataServico)} • ${esc(String(a.horaInicio).slice(0,5))}–${esc(String(a.horaFim).slice(0,5))}</strong><span class="badge ${a.status==='ACEITO'?'verified':''}">${esc(ST[a.status]||a.status)}</span></div><p class="muted">${u.tipo==='PAI'?'Babá: '+esc(a.babaNome)+' • ':''}${esc(a.endereco)} • ${Number(a.quantidadeCriancas)} criança(s)${a.observacoes?' • '+esc(a.observacoes):''}</p><div class="acoes" style="display:flex;gap:10px;flex-wrap:wrap">${u.tipo==='BABA'&&a.status==='PENDENTE'?`<button class="btn btn-primary" onclick="mudar(${Number(a.id)},'ACEITO')">Aceitar</button><button class="btn btn-outline" onclick="mudar(${Number(a.id)},'RECUSADO')">Recusar</button>`:''}${u.tipo==='PAI'&&(a.status==='PENDENTE'||a.status==='ACEITO')?`<button class="btn btn-outline" onclick="mudar(${Number(a.id)},'CANCELADO')">Cancelar</button>`:''}${ativo?`<a class="btn btn-outline" href="/atendimento.html?id=${Number(a.id)}">Acompanhar e conversar</a>`:''}</div></article>`}).join(''):'<div class="empty">Nenhum agendamento ainda.</div>'}catch(e){aviso(e.message)}}
ld();</script></body></html>
