# SafeBaba - banco de dados exclusivo Microsoft SQL Server
spring.application.name=safe-baba
server.port=8080

# SQL Server Express local (instância SQLEXPRESS).
# O SQL Server Browser resolve a porta dinâmica da instância.
# Para outro servidor, sobrescreva DB_URL por variável de ambiente.
spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost;instanceName=SQLEXPRESS;databaseName=safebaba;encrypt=true;trustServerCertificate=true}
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Hibernate detecta o dialeto SQL Server automaticamente.
# 'update' cria/atualiza tabelas sem apagar os dados existentes.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true
spring.sql.init.mode=never

# Dados fictícios ficam DESATIVADOS por padrão. Ative APP_SEED_ENABLED=true
# somente em banco de desenvolvimento/demonstração.
app.seed.enabled=${APP_SEED_ENABLED:false}

# Segurança e aplicação
app.jwt.secret=${APP_JWT_SECRET:}
app.jwt.expiration-ms=86400000
spring.jackson.time-zone=America/Sao_Paulo
app.cors.origens=${APP_CORS_ORIGENS:http://localhost:4200,http://localhost:8080}

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB
